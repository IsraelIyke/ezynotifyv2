name: Run Web Monitor
run-name: ${{ inputs.diagnose_only && format('Diagnose monitor {0}', inputs.monitor_id) || 'Run Web Monitor' }}
on:
  workflow_dispatch:
    inputs:
      monitor_id:
        description: Optional monitor ID (normally the worker drains all due checks)
        required: false
        type: string
      diagnose_only:
        description: Read-only fetch diagnosis (requires monitor_id; no results or alerts are saved)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.diagnose_only && format('ezynotify-diagnose-{0}', inputs.monitor_id) || 'ezynotify-worker' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium
        
    - name: Run website monitor
      if: ${{ !inputs.diagnose_only }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MONITOR_AI_ENDPOINT: ${{ secrets.MONITOR_AI_ENDPOINT }}
        MONITOR_AI_SECRET: ${{ secrets.MONITOR_AI_SECRET }}
        MONITOR_ID: ${{ inputs.monitor_id }}
      run: python ezynotify.py

    - name: Diagnose website fetch
      if: ${{ inputs.diagnose_only }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        MONITOR_ID: ${{ inputs.monitor_id }}
      run: python -m monitor.diagnose
