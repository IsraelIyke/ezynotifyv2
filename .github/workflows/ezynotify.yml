name: Run Web Monitor
on:
  workflow_dispatch:
    inputs:
      monitor_id:
        description: Optional monitor ID (normally the worker drains all due checks)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ezynotify-worker
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install --with-deps chromium
        
    - name: Run website monitor
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MONITOR_AI_ENDPOINT: ${{ secrets.MONITOR_AI_ENDPOINT }}
        MONITOR_AI_SECRET: ${{ secrets.MONITOR_AI_SECRET }}
        MONITOR_ID: ${{ inputs.monitor_id }}
      run: python ezynotify.py
